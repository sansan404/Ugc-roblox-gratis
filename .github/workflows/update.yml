name: Update UGC Gratis

on:
  schedule:
    - cron: "*/5 * * * *" # tiap 5 menit (cek penuh tiap jam, sisanya cek cepat)
  workflow_dispatch: # bisa dijalankan manual dari tab Actions
    inputs:
      test_notif:
        description: "Kirim 1 notif tes ke Telegram/Discord"
        type: boolean
        default: false
      send_all:
        description: "Kirim SEMUA UGC yang sedang tampil ke Telegram/Discord (sekali saja)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["data/items.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-ugc
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # selalu pakai data paling baru

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ambil data UGC gratis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_NOTIF: ${{ inputs.test_notif }}
          SEND_ALL: ${{ inputs.send_all }}
          SEARCH_PAGES: ${{ vars.SEARCH_PAGES }}
          MAX_NOTIF: ${{ vars.MAX_NOTIF }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/update.mjs

      - name: Simpan data ke repo
        run: |
          git config user.name "ugc-bot"
          git config user.email "ugc-bot@users.noreply.github.com"
          git add data/items.json
          # commit hanya kalau ada perubahan selain jam update (biar riwayat repo nggak penuh)
          if git diff --cached -U0 | grep -E '^[+-] ' | grep -vq '"updatedAt"'; then
            git commit -m "Update data UGC $(date -u +'%Y-%m-%d %H:%M') UTC"
            # kalau bentrok, pakai data hasil jalan ini (paling baru)
            git pull --rebase -X theirs -q origin main || git rebase --abort || true
            git push || (sleep 10 && git pull --rebase -X theirs -q origin main && git push) || echo "Push gagal, data dipakai di jalan berikutnya."
          else
            echo "Tidak ada perubahan data."
          fi

      - name: Siapkan website
        run: |
          mkdir -p _site/data
          cp index.html config.json _site/
          cp data/items.json _site/data/
          cp data/cara-klaim.json _site/data/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true # server GitHub kadang error sesaat
      - name: Tunggu sebentar lalu coba deploy lagi
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
